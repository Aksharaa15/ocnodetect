name: OcnoDetect QA Automation

on:
  push:
    branches: [ main, develop, feature/*, release/* ]
    paths:
      - 'QA/**'
      - '.github/workflows/qa_pipeline.yml'
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      suite:
        description: 'Test suite to run (all / selenium / api / security / load / appium)'
        required: false
        default: 'all'

env:
  OCNODETECT_API_URL:  "http://127.0.0.1:5000"
  OCNODETECT_WEB_URL:  "https://ocnodetect.vercel.app"
  JWT_TOKEN:           ${{ secrets.QA_JWT_TOKEN }}
  PYTHON_VERSION:      '3.11'
  NODE_VERSION:        '20'

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # JOB 1 — Selenium Web UI Tests (300)
  # ────────────────────────────────────────────────────────────────────────────
  selenium:
    name: Selenium Web UI Tests (300)
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Selenium dependencies
        run: pip install -r QA/selenium/requirements.txt requests openpyxl

      - name: Run Selenium Tests
        working-directory: QA/selenium
        run: |
          pytest tests/ \
            --html=../../QA/reports/selenium_report.html \
            --self-contained-html \
            --tb=short \
            --timeout=30 \
            -q
        continue-on-error: true

      - name: Upload Selenium Test Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selenium-test-report
          path: QA/reports/selenium_report.html
          retention-days: 30

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 2 — REST API Tests (300)
  # ────────────────────────────────────────────────────────────────────────────
  api:
    name: REST API Tests (300)
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install API test dependencies
        run: pip install -r QA/api/requirements.txt requests openpyxl

      - name: Run API Tests
        working-directory: QA/api
        run: |
          pytest tests/ \
            --html=../../QA/reports/api_report.html \
            --self-contained-html \
            --tb=short \
            --timeout=30 \
            -q
        continue-on-error: true

      - name: Upload API Test Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-test-report
          path: QA/reports/api_report.html
          retention-days: 30

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 3 — Security Tests (300)
  # ────────────────────────────────────────────────────────────────────────────
  security:
    name: OWASP Security Tests (300)
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Security test dependencies
        run: pip install -r QA/security/requirements.txt requests openpyxl

      - name: Run Security Tests
        working-directory: QA/security
        run: |
          pytest tests/ \
            --html=../../QA/reports/security_report.html \
            --self-contained-html \
            --tb=short \
            --timeout=30 \
            -q
        continue-on-error: true

      - name: Upload Security Test Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-test-report
          path: QA/reports/security_report.html
          retention-days: 30

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 4 — k6 Performance Tests (50 Scenarios / 300 Definitions)
  # ────────────────────────────────────────────────────────────────────────────
  load:
    name: k6 Performance Tests
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install requests openpyxl

      - name: Run Performance Scenarios
        run: python QA/load/run_k6.py

      - name: Upload Performance Test Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-test-report
          path: QA/reports/k6_*.json
          retention-days: 30

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 5 — Appium Android Mobile Tests (300)
  # ────────────────────────────────────────────────────────────────────────────
  appium:
    name: Appium Android Mobile Tests (300)
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Appium dependencies
        run: pip install -r QA/appium/requirements.txt requests pytest-html

      - name: Run Appium Tests
        working-directory: QA/appium
        run: |
          pytest tests/ \
            --html=../../QA/reports/appium_report.html \
            --self-contained-html \
            --tb=short \
            --timeout=30 \
            -q
        continue-on-error: true

      - name: Upload Appium Test Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: appium-test-report
          path: QA/reports/appium_report.html
          retention-days: 30

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 6 — Generate Final Normalized QA Reports (Excel + HTML + JSON)
  # ────────────────────────────────────────────────────────────────────────────
  generate-reports:
    name: Generate QA Reports (Excel + HTML + JSON)
    runs-on: ubuntu-latest
    needs: [ selenium, api, security, load, appium ]
    if: always()
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install report dependencies
        run: pip install openpyxl requests

      - name: Generate OcnoDetect Normalized QA Report
        run: python QA/reports/generate_report.py

      - name: Upload QA Summary Report & Normalized Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-summary-report
          path: |
            QA/reports/QA_Report.xlsx
            QA/reports/QA_Report.html
            QA/reports/QA_Summary.json
          retention-days: 90
